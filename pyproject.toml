[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formslab"
version = "0.1.0"
description = "Lab console for thermal-vacuum testing: bench instruments and hardware test sequences from the terminal"
requires-python = ">=3.10"
# The base install is a working lab console and nothing more: terminal
# rendering plus the transports the drivers actually open. `pyvisa` and
# `pyserial` are both here because the Rigol PSU driver prefers VISA and falls
# back to a raw serial line (devices/dp832a/), and a lab box should have both
# paths available rather than discovering the gap mid-test. Deliberately absent:
# numpy, matplotlib and any astrodynamics library -- driving a PSU needs none of
# them. That absence is the reason this package was split out of FORMS.
#
# `pyvisa` picks its backend itself: NI-VISA when that library is installed
# (the Windows benches), otherwise pyvisa-py. Linux and the Pi have no NI-VISA,
# so they get pyvisa-py, plus pyusb for its USBTMC transport. Windows keeps
# NI-VISA and does not pull either in.
dependencies = [
    "rich",
    "pyserial",
    "pyvisa",
    "pyvisa-py; sys_platform != 'win32'",
    "pyusb; sys_platform != 'win32'",
    "pymodbus",
    "psutil",
]

[project.scripts]
labcli = "formslab.app:main"

[project.optional-dependencies]
# The Raspberry Pi Pico that bridges USB to the cryocooler board's I2C bus.
# `mpremote` is imported lazily inside devices/cryocooler/pico_i2c.py, so the cryo modules
# import and test without it -- only talking to real hardware needs it.
pico = ["mpremote"]
# scripts/fz2fits.py, which converts sLTA frames. Separate because a bench box
# that only drives instruments should not pull astropy in.
images = ["astropy"]
# formslab.orbit: the orbit, view-factor and radiative-environment models used
# to simulate test conditions. The numpy stack stays out of the base install;
# nothing in the console or host imports formslab.orbit.
orbit = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.8"]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Command tables, the Pico firmware, and the shipped `defaults/`.
# Nothing here is written to at runtime: mutable state and the live `usbmap.json`
# live in the config directory (see formslab/config.py).
formslab = [
    "console/**/*.json",
    "devices/cryocooler/pico_board_control.py",
    "defaults/*",
    "gui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
tmp_path_retention_policy = "none"
