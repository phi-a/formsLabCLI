[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formslab"
version = "0.1.0"
description = "FORMS lab console - a hardware CLI for benchtop instruments, with optional FORMS integration"
requires-python = ">=3.10"
# The base install is a working lab console and nothing more: terminal
# rendering plus the transports the drivers actually open. `pyvisa` and
# `pyserial` are both here because the Rigol PSU driver prefers VISA and falls
# back to a raw serial line (devices/PSUCLI.py), and a lab box should have both
# paths available rather than discovering the gap mid-test. Deliberately absent:
# numpy, matplotlib and any astrodynamics library -- driving a PSU needs none of
# them. That absence is the reason this package was split out of FORMS.
dependencies = [
    "rich",
    "pyserial",
    "pyvisa",
    "pymodbus",
    "psutil",
]

[project.scripts]
labcli = "formslab.app:main"
fconsole = "formslab.app:main"

[project.optional-dependencies]
# Mission work: the API-catalog browser, the Book reader and the
# external-resource registry. Reached only through `formslab/bridge.py`, so
# without this extra the console still runs and those commands report that
# FORMS is not installed. FORMS is not on PyPI.
forms = ["forms @ git+https://github.com/phi-a/FORMS.git#subdirectory=python"]
# The Raspberry Pi Pico that bridges USB to the cryocooler board's I2C bus.
# `mpremote` is imported lazily inside devices/pico_i2c.py, so the cryo modules
# import and test without it -- only talking to real hardware needs it.
pico = ["mpremote"]
# Plotting and the Qt tab. Separate because a headless lab box should not pull
# Qt in to drive a PSU.
analysis = ["PyQt6", "matplotlib", "numpy"]
dev = ["pytest", "pytest-xdist"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Command tables, help text, the Pico firmware, and the shipped `defaults/`.
# Nothing here is written to at runtime: mutable state and the live `usbmap.json`
# live in the config directory (see formslab/config.py).
formslab = [
    "console/**/*.json",
    "devices/*.json",
    "devices/pico_board_control.py",
    "defaults/*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
tmp_path_retention_policy = "none"
