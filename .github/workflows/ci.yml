name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The console runs on a Windows bench box as well as a Linux one, and
        # the two differ where it matters most: the key reader, the process
        # lookups and the path handling all take a different branch.
        os: [ubuntu-latest, windows-latest]
    name: test (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
